<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BRECOTO® · SG C.A.</title>
<meta name="description" content="Catálogo digital BRECOTO — repuestos y accesorios para motos, importación directa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F3F5F8; --surface:#FFFFFF; --ink:#141A22; --muted:#69727E;
    --line:#E4E8EE;
    --blue:#0E3A8C; --blue-dark:#0A2C6B;
    --green:#1FA637; --green-dark:#178A2C;
    --coral:#E5433D;
    --shadow:0 18px 44px rgba(20,26,34,.12);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0; color:var(--ink); font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    background:var(--bg);
    min-height:100dvh;
    display:flex; flex-direction:column; align-items:center;
  }
  .hbar{width:100%; height:4px; background:linear-gradient(90deg, var(--blue) 0 50%, var(--green) 50% 100%); flex-shrink:0;}

  main{
    width:100%; max-width:640px; flex:1; min-height:0;
    padding:clamp(10px,2.5vh,28px) 20px clamp(14px,3vh,32px);
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:clamp(8px,2vh,18px);
    text-align:center;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color:var(--muted);
    margin:0; flex-shrink:0;
  }

  .frame{
    width:100%; max-width:520px; flex-shrink:0;
    overflow:hidden; border-radius:0;
    box-shadow:var(--shadow); border:1px solid var(--line);
    background:var(--surface);
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .frame img{ width:100%; height:auto; display:block; }

  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){ .frame, h1{animation:none;} }

  h1{
    font-family:'Archivo',sans-serif; font-weight:900;
    font-size:clamp(32px,7vh,58px);
    line-height:.98; letter-spacing:-.03em;
    margin:0; flex-shrink:0;
    text-wrap:balance;
    animation:rise .6s .08s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 .dot{color:var(--coral);}

  p.lead{
    font-size:clamp(13px,2vh,16px); line-height:1.5; color:var(--muted);
    max-width:38ch; margin:0; flex-shrink:0;
  }

  .cta{
    display:inline-flex; align-items:center; gap:10px; flex-shrink:0;
    background:var(--blue); color:#fff;
    font-family:'Archivo',sans-serif; font-weight:800; font-size:clamp(14px,2.2vh,17px);
    padding:clamp(12px,2vh,18px) 30px; border-radius:14px;
    text-decoration:none;
    box-shadow:0 12px 28px rgba(14,58,140,.32);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease;
  }
  .cta:hover{ background:var(--blue-dark); transform:translateY(-2px); box-shadow:0 16px 32px rgba(14,58,140,.38); }
  .cta:active{ transform:translateY(0); }
  .cta:focus-visible{ outline:3px solid var(--green); outline-offset:3px; }
  .cta svg{width:19px; height:19px; transition:transform .15s ease;}
  .cta:hover svg{ transform:translateX(3px); }

  footer{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--muted); letter-spacing:.02em; flex-shrink:0;
  }
</style>
</head>
