<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>BRECOTO® · SG C.A.</title>
<meta name="description" content="Catálogo digital BRECOTO — repuestos y accesorios para motos, importación directa.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;800;900&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --surface:#FFFFFF; --ink:#141A22;
    --line:#E4E8EE;
    --blue:#0E3A8C; --blue-dark:#0A2C6B;
    --green:#1FA637; --green-dark:#178A2C;
    --coral:#FF6A5E; --seam:#0d1b17;
    --white-90:rgba(255,255,255,.92); --white-70:rgba(255,255,255,.72);
    --shadow:0 20px 48px rgba(6,20,20,.28);
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  html{height:100%;}
  body{
    margin:0; min-height:100%; color:#fff; font-family:'Inter',sans-serif;
    -webkit-font-smoothing:antialiased;
    background:
      radial-gradient(ellipse 900px 620px at 6% -8%, rgba(255,255,255,.30), transparent 62%),
      radial-gradient(ellipse 760px 700px at 102% 108%, rgba(124,255,154,.40), transparent 60%),
      radial-gradient(ellipse 500px 500px at 96% -6%, rgba(255,255,255,.16), transparent 60%),
      linear-gradient(135deg, var(--blue-dark) 0%, var(--blue) 45%, var(--seam) 49.6%, var(--seam) 50.4%, var(--green-dark) 55%, var(--green) 100%);
    display:flex; flex-direction:column; align-items:center;
  }
  .hbar{width:100%; height:5px; background:linear-gradient(90deg, #fff 0 50%, var(--green-dark) 50% 100%); flex-shrink:0;}

  main{
    width:100%; max-width:600px;
    padding:28px 20px 36px;
    display:flex; flex-direction:column; align-items:center;
    gap:14px;
    text-align:center;
  }

  .eyebrow{
    font-family:'IBM Plex Mono',monospace; font-size:11px; font-weight:600;
    letter-spacing:.14em; text-transform:uppercase; color:var(--white-70);
    margin:0 0 4px;
  }

  .frame{
    width:100%; max-width:480px;
    overflow:hidden; border-radius:0;
    box-shadow:var(--shadow); border:3px solid #fff;
    background:var(--surface);
    animation:rise .55s cubic-bezier(.2,.8,.2,1) both;
  }
  .frame img{ width:100%; height:auto; display:block; }

  @keyframes rise{ from{opacity:0; transform:translateY(14px);} to{opacity:1; transform:translateY(0);} }
  @media (prefers-reduced-motion:reduce){ .frame, h1{animation:none;} }

  h1{
    font-family:'Archivo',sans-serif; font-weight:900;
    font-size:40px;
    line-height:1; letter-spacing:-.03em;
    margin:8px 0 0; color:#fff;
    text-wrap:balance;
    animation:rise .6s .08s cubic-bezier(.2,.8,.2,1) both;
  }
  h1 .dot{color:var(--coral);}
  .welcome-sub .dot{color:var(--coral); font-size:.8em; margin:0 2px; opacity:.85;}

  p.welcome-sub{
    font-family:'Archivo',sans-serif; font-weight:700;
    font-size:15px; line-height:1.4; color:#fff;
    max-width:34ch; margin:0;
  }

  p.lead{
    font-size:13.5px; line-height:1.55; color:var(--white-90);
    max-width:38ch; margin:0;
  }

  .cta{
    display:inline-flex; align-items:center; gap:10px;
    background:#fff; color:var(--blue);
    font-family:'Archivo',sans-serif; font-weight:800; font-size:15.5px;
    padding:14px 30px; border-radius:14px;
    text-decoration:none;
    margin-top:6px;
    box-shadow:0 12px 28px rgba(6,20,20,.32);
    transition:transform .15s ease, box-shadow .15s ease, background .15s ease, color .15s ease;
  }
  .cta:hover{ background:var(--green); color:#fff; transform:translateY(-2px); box-shadow:0 16px 32px rgba(6,20,20,.38); }
  .cta:active{ transform:translateY(0); }
  .cta:focus-visible{ outline:3px solid #fff; outline-offset:3px; }
  .cta svg{width:19px; height:19px; transition:transform .15s ease;}
  .cta:hover svg{ transform:translateX(3px); }

  footer{
    font-family:'IBM Plex Mono',monospace; font-size:10.5px;
    color:var(--white-70); letter-spacing:.02em; flex-shrink:0;
  }

  @media (min-width:600px){
    main{padding:48px 24px 56px; gap:16px;}
    h1{font-size:56px;}
    p.welcome-sub{font-size:17px;}
    p.lead{font-size:15px;}
    .cta{font-size:17px; padding:16px 34px;}
  }
</style>
</head>
